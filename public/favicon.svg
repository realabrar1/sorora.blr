<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222B1E" />
      <stop offset="100%" stop-color="#121610" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C88373" />
      <stop offset="100%" stop-color="#E5A698" />
    </linearGradient>
  </defs>

  <!-- Circle Emblem Outer Ring -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Inner Soft Accent Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#C88373" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Botanical Lotus Leaves & S-Curve Motif -->
  <g transform="translate(256, 266)">
    <!-- Central Main Lotus Petal -->
    <path d="M0,-140 C45,-70 55,0 0,70 C-55,0 -45,-70 0,-140 Z" fill="url(#goldGrad)" />
    
    <!-- Left Petal -->
    <path d="M-20,-110 C-90,-60 -105,15 -35,65 C-15,35 -20,-30 -20,-110 Z" fill="url(#terracottaGrad)" opacity="0.9" />
    
    <!-- Right Petal -->
    <path d="M20,-110 C90,-60 105,15 35,65 C15,35 20,-30 20,-110 Z" fill="url(#terracottaGrad)" opacity="0.9" />

    <!-- Center Monogram S Curve -->
    <path d="M-12,-40 C15,-40 18,-15 -5,-2 C-25,10 -20,35 15,35" fill="none" stroke="#121610" stroke-width="9" stroke-linecap="round" />
    
    <!-- Small Golden Star Accent -->
    <path d="M0,-165 L4,-153 L16,-149 L7,-140 L9,-128 L0,-135 L-9,-128 L-7,-140 L-16,-149 L-4,-153 Z" fill="url(#goldGrad)" />
  </g>
</svg>
